name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # submodules: true pulls backend/vendor/quoridor-mcts, the C++ engine the image
      # compiles into a wheel. Without it the build still succeeds and the MCTS bot tier
      # reports itself unavailable.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve engine commit
        id: engine
        run: |
          if [ -f backend/vendor/quoridor-mcts/setup.py ]; then
            echo "commit=$(git -C backend/vendor/quoridor-mcts rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "commit=absent" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            QMCTS_COMMIT=${{ steps.engine.outputs.commit }}
          tags: |
            ghcr.io/samuelbaldwin05/quoridor-backend:latest
            ghcr.io/samuelbaldwin05/quoridor-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App revision
        run: |
          az containerapp update \
            --name quoridor-backend \
            --resource-group quoridor-rg \
            --image ghcr.io/samuelbaldwin05/quoridor-backend:${{ github.sha }}
