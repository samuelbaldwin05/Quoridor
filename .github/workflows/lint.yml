name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: TypeScript
        working-directory: frontend
        run: bun run tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: bun run lint
