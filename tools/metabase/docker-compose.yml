# Metabase for testing Quoridor analytics against the production Supabase database.
#
# Run from this directory:
#   docker compose up -d
# then open http://localhost:3000 and create the local admin account.
#
# The Supabase data source is added through the Metabase web UI (see README.md), not
# here, so this file contains no secrets and is safe to commit.
services:
  metabase:
    image: metabase/metabase:latest # pin a version (e.g. :v0.50.x) for reproducibility
    container_name: quoridor-metabase
    ports:
      - "3000:3000"
    environment:
      # Metabase's OWN application database, where it stores your dashboards and saved
      # questions. An H2 file on the mounted volume is fine for local testing. Switch to
      # Postgres (MB_DB_TYPE=postgres + MB_DB_HOST/PORT/DBNAME/USER/PASS) if you ever
      # deploy this so the state is durable.
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      # Persists your dashboards across container restarts. Without it, they are lost.
      - metabase-data:/metabase-data
    restart: unless-stopped

volumes:
  metabase-data:
