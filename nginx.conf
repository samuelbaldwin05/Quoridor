resolver 127.0.0.11 valid=10s ipv6=off;

# Reflect the request Origin back as the allowed origin (dev only — all localhost origins permitted)
map $http_origin $cors_origin {
    default         "";
    "~^http://localhost"   $http_origin;
    "~^http://127\.0\.0\.1" $http_origin;
}

server {
    listen 80;

    # ── Auth (GoTrue) — /auth/v1/* → GoTrue root ─────────────────────────────
    location /auth/v1/ {
        set $upstream_auth auth:9999;

        # Answer CORS preflight directly — no round-trip to GoTrue needed
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'      $cors_origin;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, apikey, x-client-info, x-supabase-api-version';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Max-Age'           '86400';
            return 204;
        }

        # Strip /auth/v1 prefix before forwarding — required when proxy_pass uses a variable
        rewrite ^/auth/v1/(.*) /$1 break;

        proxy_pass         http://$upstream_auth;
        proxy_set_header   Host              $host;
        proxy_set_header   Origin            $http_origin;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Ensure CORS header is on every response (e.g. redirects, errors)
        add_header 'Access-Control-Allow-Origin'      $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true'       always;
    }

    # ── PostgREST — /rest/v1/* → PostgREST root ──────────────────────────────
    location /rest/v1/ {
        set $upstream_rest rest:3000;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'      $cors_origin;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, apikey, Prefer, Range';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Max-Age'           '86400';
            return 204;
        }

        rewrite ^/rest/v1/(.*) /$1 break;

        proxy_pass         http://$upstream_rest;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header 'Access-Control-Allow-Origin'      $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true'       always;
    }
}
