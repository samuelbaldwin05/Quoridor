services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override SUPABASE_URL — inside Docker, reach Supabase via internal network
      SUPABASE_URL: http://supabase_kong_QuoridorEngine:8000
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv
    command: uv run uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  backend-venv:
  frontend-node-modules:

networks:
  default:
    name: supabase_network_QuoridorEngine
    external: true
